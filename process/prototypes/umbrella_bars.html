<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Umbrella bars</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 24px; color: #0b0b0b; background: #fcfcfb; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #52514e; max-width: 46rem; }
  svg { display: block; }
  .axis text { font-size: 12px; fill: #52514e; }
  .axis .domain { display: none; }               /* hide D3's default axis line */
  .grid line { stroke: #e1e0d9; }
  .value { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .legend { font-size: 12px; fill: #52514e; }
</style>
</head>
<body>

<h1>The average call under each topic umbrella</h1>
<p>Bar height is the average number of words per call. Colors split those words by the kind of utterance they sit in.</p>
<svg id="chart"></svg>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
// ---------------------------------------------------------------------------
// 1. DATA
// One row per umbrella. The five numbers are average words per call, by the
// sentence type of the utterance the words sit in. They add up to the bar height.
// ---------------------------------------------------------------------------
const data = [
  { umbrella: "Sports & outdoors",        calls: 55, fluent: 606.8, disfluent: 523.2, unfinished: 100.3, fragment: 60.0, response: 58.2 },
  { umbrella: "Small talk",               calls: 37, fluent: 531.5, disfluent: 496.9, unfinished:  78.1, fragment: 63.0, response: 59.1 },
  { umbrella: "Home & hobbies",           calls: 93, fluent: 552.3, disfluent: 507.3, unfinished:  98.8, fragment: 65.1, response: 61.7 },
  { umbrella: "Family",                   calls: 56, fluent: 491.2, disfluent: 493.4, unfinished: 100.9, fragment: 51.0, response: 55.4 },
  { umbrella: "Entertainment & media",    calls: 76, fluent: 501.3, disfluent: 544.8, unfinished: 110.5, fragment: 70.1, response: 61.9 },
  { umbrella: "Science & environment",    calls: 53, fluent: 454.8, disfluent: 552.9, unfinished: 111.2, fragment: 58.7, response: 51.6 },
  { umbrella: "Money & work",             calls: 65, fluent: 402.6, disfluent: 504.6, unfinished:  93.9, fragment: 56.7, response: 47.6 },
  { umbrella: "Education & society",      calls: 57, fluent: 408.0, disfluent: 579.2, unfinished: 111.1, fragment: 65.2, response: 48.6 },
  { umbrella: "Law & justice",            calls: 93, fluent: 380.0, disfluent: 555.4, unfinished: 133.7, fragment: 68.4, response: 44.4 },
  { umbrella: "Politics & world affairs", calls: 65, fluent: 376.5, disfluent: 599.6, unfinished: 127.7, fragment: 62.4, response: 42.4 }
];

// The stacking order, bottom to top, with a label and a color for each type.
const types = [
  { key: "fluent",     label: "Complete sentence, fluent",            color: "#184f95" },
  { key: "disfluent",  label: "Complete sentence, with a disfluency", color: "#6da7ec" },
  { key: "unfinished", label: "Unfinished clause",                    color: "#eb6834" },
  { key: "fragment",   label: "Fragment (no clause)",                 color: "#1baf7a" },
  { key: "response",   label: "Response token (yeah, uh-huh)",        color: "#c3c2b7" }
];
const keys = types.map(t => t.key);

// Add each row's total, then sort by the share of fluent words (highest first).
data.forEach(d => { d.total = d3.sum(keys, k => d[k]); });
data.sort((a, b) => d3.descending(a.fluent / a.total, b.fluent / b.total));

// ---------------------------------------------------------------------------
// 2. CANVAS
// The margins leave room for the axis labels around the plotting area.
// ---------------------------------------------------------------------------
const width = 960, height = 460;
const margin = { top: 70, right: 20, bottom: 60, left: 50 };

const svg = d3.select("#chart")
  .attr("width", width)
  .attr("height", height)
  .attr("viewBox", [0, 0, width, height]);

// ---------------------------------------------------------------------------
// 3. SCALES
// A scale is a function from data values to pixels.
// ---------------------------------------------------------------------------
// x: umbrella name -> horizontal position. scaleBand divides the width into
// equal slots; padding is the fraction of each slot left empty.
const x = d3.scaleBand()
  .domain(data.map(d => d.umbrella))
  .range([margin.left, width - margin.right])
  .padding(0.6);

// y: words -> vertical position. SVG's y runs downward, so the range is
// flipped: 0 words maps to the bottom of the plot.
const y = d3.scaleLinear()
  .domain([0, d3.max(data, d => d.total)]).nice()
  .range([height - margin.bottom, margin.top]);

// color: type key -> fill color.
const color = d3.scaleOrdinal()
  .domain(keys)
  .range(types.map(t => t.color));

// ---------------------------------------------------------------------------
// 4. STACK
// d3.stack turns the rows into one "series" per type. Each series holds a
// [start, end] pair for every umbrella: where that segment begins and ends
// when the types are piled on top of each other.
//   series[0]        -> the "fluent" series
//   series[0][3]     -> [0, 491.2]      the fluent segment of the 4th bar
//   series[1][3]     -> [491.2, 984.6]  the disfluent segment sits on top of it
//   series[0][3].data-> the original row for that bar
// ---------------------------------------------------------------------------
const series = d3.stack().keys(keys)(data);

// ---------------------------------------------------------------------------
// 5. GRIDLINES AND AXES (drawn first so the bars sit on top)
// ---------------------------------------------------------------------------
svg.append("g")
  .attr("class", "grid")
  .selectAll("line")
  .data(y.ticks(4))
  .join("line")
    .attr("x1", margin.left)
    .attr("x2", width - margin.right)
    .attr("y1", d => y(d))
    .attr("y2", d => y(d));

svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(4).tickSize(0).tickPadding(8));

const xAxis = svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSize(0).tickPadding(10));

// Long names do not fit under a bar, so break each label after its "&".
xAxis.selectAll("text").each(function (name) {
  const lines = name.split(/(?<=&) /);
  d3.select(this).text(null)
    .selectAll("tspan")
    .data(lines)
    .join("tspan")
      .attr("x", 0)
      .attr("dy", (line, i) => (i === 0 ? "0.71em" : "1.2em"))
      .text(line => line);
});

// ---------------------------------------------------------------------------
// 6. BARS
// Two nested data joins: one <g> per type (sets the color), and inside it
// one <rect> per umbrella (sets the position and height).
// ---------------------------------------------------------------------------
svg.append("g")
  .selectAll("g")
  .data(series)                                 // five series -> five groups
  .join("g")
    .attr("fill", s => color(s.key))
  .selectAll("rect")
  .data(s => s.map(d => (d.key = s.key, d)))    // ten segments in each group, each tagged with its type
  .join("rect")
    .attr("x", d => x(d.data.umbrella))
    .attr("width", x.bandwidth())
    .attr("y", d => y(d[1]))                    // top edge = end of the segment
    .attr("height", d => y(d[0]) - y(d[1]))     // start minus end, in pixels
    .attr("stroke", "#fcfcfb")                  // thin background-colored gap
    .attr("stroke-width", 1)
  .append("title")                              // browser tooltip on hover
    .text(d => {
      const words = d[1] - d[0];
      const label = types.find(t => t.key === d.key).label;
      return `${d.data.umbrella}\n${label}: ${d3.format(".0f")(words)} words (${d3.format(".0%")(words / d.data.total)})`;
    });

// ---------------------------------------------------------------------------
// 7. VALUE LABELS
// The average length above each bar.
// ---------------------------------------------------------------------------
svg.append("g")
  .selectAll("text")
  .data(data)
  .join("text")
    .attr("class", "value")
    .attr("x", d => x(d.umbrella) + x.bandwidth() / 2)
    .attr("y", d => y(d.total) - 6)
    .text(d => d3.format(",.0f")(d.total));

// ---------------------------------------------------------------------------
// 8. LEGEND
// One swatch and label per type, laid out in a row above the plot.
// ---------------------------------------------------------------------------
const legend = svg.append("g")
  .attr("class", "legend")
  .attr("transform", `translate(${margin.left},14)`)
  .selectAll("g")
  .data(types)
  .join("g");

legend.append("rect").attr("width", 12).attr("height", 12).attr("fill", t => t.color);
legend.append("text").attr("x", 18).attr("y", 10).text(t => t.label);

// Measure each legend item, then place them left to right, wrapping when a row is full.
let lx = 0, ly = 0;
legend.each(function () {
  const w = this.getBBox().width + 22;
  if (lx + w > width - margin.left - margin.right) { lx = 0; ly += 20; }
  d3.select(this).attr("transform", `translate(${lx},${ly})`);
  lx += w;
});
</script>
</body>
</html>
